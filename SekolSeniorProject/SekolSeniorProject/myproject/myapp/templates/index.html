{% load custom_filters %}

<!DOCTYPE html>
<html>
<head>
    <title>SQL Query Builder</title>
</head>
<body>
    <form method="post">
        {% csrf_token %}

        <!-- First Condition -->
        <label for="column1">Choose a column:</label>
        <select name="column1" id="column1">
            {% for header in headers %}
                <option value="{{ header }}">{{ header }}</option>
            {% endfor %}
        </select>
        <select name="condition1" id="condition1">
            <option value="=">equal to</option>
            <option value="!=">not equal to</option>
            <option value=">">greater than</option>
            <option value="<">less than</option>
            <option value="LIKE">like</option>
        </select>
        <input type="text" name="value1" placeholder="Enter value">

        <br><br>

        <!-- Second Condition -->
        <label for="column2">Choose another column:</label>
        <select name="column2" id="column2">
            {% for header in headers %}
                <option value="{{ header }}">{{ header }}</option>
            {% endfor %}
        </select>
        <select name="condition2" id="condition2">
            <option value="=">equal to</option>
            <option value="!=">not equal to</option>
            <option value=">">greater than</option>
            <option value="<">less than</option>
            <option value="LIKE">like</option>
        </select>
        <input type="text" name="value2" placeholder="Enter value">

        <br><br>

        <button type="submit">Submit</button>
    </form>

    {% if items %}
    <h2>Filtered Results</h2>
    <table border="1">
        <tr>
            {% for header in headers %}
                <th>{{ header }}</th>
            {% endfor %}
        </tr>
        {% for item in items %}
            <tr>
                {% for header in headers %}
                    <td>{{ item|get_item:header }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </table>
    {% endif %}
</body>
</html>
